name: Test Ethos-U

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.target-type }} Debug (${{ matrix.toolchain }}) on FVP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { solution: Test-Ethos-U55, target-type: SSE-300-U55, toolchain: AC6, fvp: FVP_Corstone_SSE-300_Ethos-U55, fvp-config: Board/Corstone-300/fvp_config_u55.txt, image: out/Test-Ethos-U/SSE-300-U55/Debug/Test-Ethos-U.axf }
          - { solution: Test-Ethos-U55, target-type: SSE-300-U55, toolchain: GCC, fvp: FVP_Corstone_SSE-300_Ethos-U55, fvp-config: Board/Corstone-300/fvp_config_u55.txt, image: out/Test-Ethos-U/SSE-300-U55/Debug/Test-Ethos-U.elf }
          - { solution: Test-Ethos-U65, target-type: SSE-300-U65, toolchain: AC6, fvp: FVP_Corstone_SSE-300_Ethos-U65, fvp-config: Board/Corstone-300/fvp_config_u65.txt, image: out/Test-Ethos-U/SSE-300-U65/Debug/Test-Ethos-U.axf }
          - { solution: Test-Ethos-U65, target-type: SSE-300-U65, toolchain: GCC, fvp: FVP_Corstone_SSE-300_Ethos-U65, fvp-config: Board/Corstone-300/fvp_config_u65.txt, image: out/Test-Ethos-U/SSE-300-U65/Debug/Test-Ethos-U.elf }
          - { solution: Test-Ethos-U85, target-type: SSE-320-U85, toolchain: AC6, fvp: FVP_Corstone_SSE-320,           fvp-config: Board/Corstone-320/fvp_config_u85.txt, image: out/Test-Ethos-U/SSE-320-U85/Debug/Test-Ethos-U.axf }
          - { solution: Test-Ethos-U85, target-type: SSE-320-U85, toolchain: GCC, fvp: FVP_Corstone_SSE-320,           fvp-config: Board/Corstone-320/fvp_config_u85.txt, image: out/Test-Ethos-U/SSE-320-U85/Debug/Test-Ethos-U.elf }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/Test-Ethos-U/script/requirements.txt

      - name: Install Vela and converter dependencies
        run: |
          python -m pip install ethos-u-vela -r examples/Test-Ethos-U/script/requirements.txt
          vela --version

      - name: Activate vcpkg environment
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: examples/Test-Ethos-U/vcpkg-configuration.json
          cache: Test-Ethos-U

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Initialize CMSIS pack root
        run: |
          cpackget init https://www.keil.com/pack/index.pidx
          cpackget update-index

      - name: Register local CMSIS-Ethos-U pack
        run: cpackget add ./ARM.CMSIS-Ethos-U.pdsc

      - name: Generate MLOps build information
        working-directory: ./examples/Test-Ethos-U
        run: >-
          cbuild setup "${{ matrix.solution }}.csolution.yml" --active "${{ matrix.target-type }}" --toolchain "${{ matrix.toolchain }}" --packs

      - name: Compile models with Vela
        working-directory: ./examples/Test-Ethos-U
        run: python script/model-converter.py "${{ matrix.solution }}.cbuild-mlops.yml"

      - name: Build ${{ matrix.solution }} for ${{ matrix.target-type }}
        working-directory: ./examples/Test-Ethos-U
        run: >-
          cbuild "${{ matrix.solution }}.csolution.yml" --active "${{ matrix.target-type }}" --toolchain "${{ matrix.toolchain }}"

      - name: Run ${{ matrix.target-type }} FVP
        working-directory: ./examples/Test-Ethos-U
        run: |
          set -o pipefail
          "${{ matrix.fvp }}" \
            -f "${{ matrix.fvp-config }}" \
            -a "${{ matrix.image }}" \
            --simlimit 120 2>&1 | tee fvp.log

          grep -Fq "[PASS] hello_world" fvp.log
          grep -Fq "[PASS] tiny_cnn" fvp.log
          grep -Fq "TEST RESULT: PASS" fvp.log

      - name: Upload build and FVP log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.solution }}-${{ matrix.toolchain }}
          path: |
            ./examples/Test-Ethos-U/out/Test-Ethos-U
            ./examples/Test-Ethos-U/fvp.log
          if-no-files-found: warn
