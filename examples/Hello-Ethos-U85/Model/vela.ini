; Vela configuration for the Arm Corstone-320 (SSE-320) reference system.
;
; The system configuration mirrors Ethos_U85_SYS_DRAM_Mid from Vela's built-in
; vela.ini, which matches the Corstone-320 topology used by this example:
;
;   Axi0 -> Sram -> SRAM_VM0_S @ 0x31000000 (2 MB on-chip SRAM)
;   Axi1 -> Dram -> DDR4_x_S   @ 0x70000000 / 0x90000000
;
; The linker places the model in ROM2 (DDR4_3, reached over Axi1) and both the
; tensor arena and the Ethos-U cache in RAM1 (SRAM_VM0, reached over Axi0). See
; Board/Corstone-320/RTE/Device/SSE-320-FVP/*_linker_script.*.

; Note: the memory-name prefixes below are case-sensitive. Vela derives the
; memory names ("Sram", "Dram") from them, so writing sram_clock_scale instead
; of Sram_clock_scale fails with "Memory 'Sram' not found in configured memories".
[System_Config.Corstone_320]
core_clock=1e9
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=64
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.75
Dram_ports_used=1
Dram_burst_length=128
Dram_read_latency=500
Dram_write_latency=250
Dram_max_reads=64
Dram_max_writes=32

; Memory modes. Each one implies a different set of NPU_QCONFIG / NPU_REGIONCFG_*
; values in Hello-Ethos-U85.csolution.yml -- see "Exploring memory modes" in README.md.
; Changing the mode here without changing those defines produces a model whose
; command stream reads through the wrong AXI port.

[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0

[Memory_Mode.Dedicated_Sram]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0

; arena_cache_size must equal ETHOS_CACHE_BUF_SIZE in
; Board/Corstone-320/ethos_setup.c (both 384 KB). The driver hands that buffer
; to the NPU as the cache/staging area; if Vela plans for a larger one the NPU
; reads past the end of it.
[Memory_Mode.Dedicated_Sram_384KB]
inherit=Memory_Mode.Dedicated_Sram
arena_cache_size=393216
