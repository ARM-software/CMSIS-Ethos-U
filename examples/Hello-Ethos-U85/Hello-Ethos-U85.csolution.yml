solution:
  description: TensorFlow Lite Micro on Ethos-U85, running as an integration test
    on the Corstone-320 FVP
  created-for: CMSIS-Toolbox@2.13.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC

  compiler: AC6

  packs:
    - pack: ARM::SSE_320_BSP@1.1.0

  # This solution targets exactly one system. Ethos-U55 (Corstone-300) and
  # Ethos-U65 (Corstone-315) are provided as separate, self-contained solutions
  # so that each example stays free of unrelated targets and board layers.
  target-types:
    - type: SSE-320-U85
      board: ARM::SSE-320
      device: ARM::SSE-320-FVP
      variables:
        - Board-Layer: ./Board/Corstone-320/Board.clayer.yml
      target-set:
        - set:
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-320
            config-file: ./Board/Corstone-320/fvp_config.txt
            args: ""
          images:
            - project-context: Hello-Ethos-U85.Debug

  # The NPU_* values below must stay consistent with the Vela --memory-mode used
  # to compile the model in Model/gen/regenerate.sh. The committed model is built
  # for Dedicated_Sram_384KB: model constants and command stream via Axi1
  # (values 2/3), the arena via Axi1, and the NPU cache via Axi0 (values 0/1).
  # See Model/vela.ini and README.md ("Exploring memory modes").
  build-types:
    - type: Debug
      debug: on
      optimize: debug

    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: ./Hello-Ethos-U85.cproject.yml
