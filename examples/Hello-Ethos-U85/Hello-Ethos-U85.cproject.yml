project:
  description: Ethos-U85 TFLM example and integration test

  packs:
    - pack: ARM::CMSIS-RTX@^5.9.0

  connections:
    - connect: TFLM Ethos-U85 Test
      consumes:
        - STDOUT
      provides:
        - CMSIS-RTOS2

  groups:
    - group: Documentation
      files:
        - file: ./README.md

    - group: Test
      files:
        - file: ./Source/test_main.cpp

  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source

  layers:
    - layer: $SolutionDir()$/Model/ML-Model.clayer.yml

    - layer: $Board-Layer$
      type: Board

  output:
    type:
      - elf
      - hex
      - map
