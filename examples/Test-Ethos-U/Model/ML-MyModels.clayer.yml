layer:
  type: ML-Model
  description: TensorFlow Lite Micro with Ethos-U kernels, plus the models and their Vela builds

  packs:
    - pack: ARM::CMSIS-NN@^7.0.0
    - pack: tensorflow::flatbuffers
    - pack: tensorflow::gemmlowp
    - pack: tensorflow::kissfft
    - pack: tensorflow::ruy
    - pack: tensorflow::tensorflow-lite-micro

  components:
    - component: ARM::CMSIS:NN Lib

    - component: tensorflow::Data Exchange:Serialization:flatbuffers
    - component: tensorflow::Data Processing:Math:gemmlowp fixed-point
    - component: tensorflow::Data Processing:Math:kissfft
    - component: tensorflow::Data Processing:Math:ruy

    - component: tensorflow::Machine Learning:TensorFlow:Kernel&Ethos-U
    - component: tensorflow::Machine Learning:TensorFlow:Kernel Utils
      define:
        - ARM_MODEL_USE_PMU_COUNTERS

  define:
    - MODEL_HELLO_WORLD
    - MODEL_TINY_CNN

  groups:
    - group: Model/hello_world
      files:
        - file: hello_world/README.md
        - file: hello_world/VELA_SUMMARY.md
        - file: hello_world/hello_world_model.c
        - file: hello_world/hello_world_int8.tflite
        - file: hello_world/hello_world_int8_vela.tflite
        - file: hello_world/reference_data.c
        - file: hello_world/reference_data.h

    - group: Model/tiny_cnn
      files:
        - file: tiny_cnn/README.md
        - file: tiny_cnn/VELA_SUMMARY.md
        - file: tiny_cnn/tiny_cnn_model.c
        - file: tiny_cnn/tiny_cnn_int8.tflite
        - file: tiny_cnn/tiny_cnn_int8_vela.tflite
        - file: tiny_cnn/reference_data.c
        - file: tiny_cnn/reference_data.h
