; -----------------------------------------------------------------------------
; Vela configuration file used by the Corstone-300 and Corstone-320 examples.
; Mirrors parts of the Vela built-in system configurations.

; -----------------------------------------------------------------------------
; System Configuration

; Ethos-U55 High-End Embedded: SRAM (4 GB/s) and Flash (0.5 GB/s)
; AXI0 used for on-chip SRAM, AXI1 used for off-chip (read-only) Flash
[System_Config.Ethos_U55_High_End_Embedded]
core_clock=500e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=4
Sram_max_writes=4
OffChipFlash_clock_scale=0.125
OffChipFlash_burst_length=128
OffChipFlash_read_latency=64
OffChipFlash_write_latency=0
OffChipFlash_max_reads=2
OffChipFlash_max_writes=0

; Ethos-U65 Embedded: SRAM (8 GB/s) and Flash (0.5 GB/s)
; AXI0 used for on-chip SRAM, AXI1 used for off-chip (read-only) Flash
[System_Config.Ethos_U65_Embedded]
core_clock=500e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
OffChipFlash_clock_scale=0.0625
OffChipFlash_burst_length=128
OffChipFlash_read_latency=64
OffChipFlash_write_latency=0
OffChipFlash_max_reads=2
OffChipFlash_max_writes=0

; Ethos-U65 Mid-End: SRAM (8 GB/s) and DRAM (3.75 GB/s)
; AXI0 used for on-chip SRAM, AXI1 used for off-chip DRAM
[System_Config.Ethos_U65_Mid_End]
core_clock=500e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.46875
Dram_burst_length=128
Dram_read_latency=500
Dram_write_latency=250
Dram_max_reads=12
Dram_max_writes=6

; SRAMx2 (32 GB/s) and DRAM (12 GB/s)
; AXI0 used for on-chip SRAM, AXI1 used for off-chip DRAM
[System_Config.Ethos_U85_SYS_DRAM_Mid]
core_clock=1e9
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=64
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.75
Dram_ports_used=1
Dram_burst_length=128
Dram_read_latency=500
Dram_write_latency=250
Dram_max_reads=64
Dram_max_writes=32

; -----------------------------------------------------------------------------
; Memory Mode

; Each one requires a different set of NPU_QCONFIG / NPU_REGIONCFG_* values.
; Changing the mode without changing those defines produces a model whose
; command stream reads through the wrong AXI port.
; See "Exploring memory modes" in README.md.

; SRAM Only: only one AXI port is used and the SRAM is used for all storage
[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

; Shared SRAM: the SRAM is shared between the Ethos-U and the Cortex-M software
; The non-SRAM memory is assumed to be read-only
[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0

; Dedicated SRAM: the SRAM is only for use by the Ethos-U
; The non-SRAM memory is assumed to be read-writeable
[Memory_Mode.Dedicated_Sram]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0

; Dedicated SRAM 384KB: the SRAM (384KB) is only for use by the Ethos-U
; The non-SRAM memory is assumed to be read-writeable
; ETHOS_CACHE_SIZE in Board/Corstone-320/ethos_setup.c must match arena_cache_size value.
[Memory_Mode.Dedicated_Sram_384KB]
inherit=Memory_Mode.Dedicated_Sram
arena_cache_size=393216
